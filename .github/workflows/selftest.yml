name: self-test

# The tool has no dependencies, so the whole check is one command per Python.
# 3.10 is the floor: the code uses PEP 604 unions (str | Path) in annotations.
# ponytail: two interpreters, not a matrix of versions across all platforms.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit self-test
        run: python3 audit.py --self-test
      - name: Worked example still reproduces
        run: |
          python3 audit.py examples/demo-usage.csv --out /tmp/demo-report.md
          diff /tmp/demo-report.md examples/demo-report.md
